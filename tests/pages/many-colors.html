<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test Page — Many Elements & Complex DOM</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 40px;
        background: #f8fafc;
        color: #0f172a;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 8px;
        margin-top: 20px;
      }
      .item {
        padding: 12px 6px;
        border-radius: 4px;
        text-align: center;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Many Colors DOM Analyzer Test</h1>
    <p>
      Stress-tests the Webpage Color Analyzer across dozens of computed text,
      background, and border colors.
    </p>

    <div class="grid">
      <script>
        const baseColors = [
          "#ef4444",
          "#f97316",
          "#f59e0b",
          "#84cc16",
          "#10b981",
          "#06b6d4",
          "#3b82f6",
          "#8b5cf6",
          "#d946ef",
          "#f43f5e",
          "#64748b",
          "#0f172a",
        ];
        for (let i = 0; i < 48; i++) {
          const bg = baseColors[i % baseColors.length];
          const border = baseColors[(i + 3) % baseColors.length];
          const text = i % 2 === 0 ? "#ffffff" : "#000000";
          document.write(`
          <div class="item" style="background-color: ${bg}; border: 2px solid ${border}; color: ${text};">
            Item ${i + 1}
          </div>
        `);
        }
      </script>
    </div>
  </body>
</html>
