<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test Page — CSS Gradients</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 40px;
        background: #f8fafc;
        color: #0f172a;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-top: 20px;
      }
      .box {
        height: 180px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-weight: bold;
        color: white;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <h1>Gradients Test Page</h1>
    <p>
      Test real pixel raster sampling on rendered linear, radial, and conic CSS
      gradients.
    </p>

    <div class="grid">
      <div
        class="box"
        style="background: linear-gradient(90deg, #ff0000 0%, #0000ff 100%)"
      >
        Linear: Red to Blue
      </div>
      <div
        class="box"
        style="
          background: linear-gradient(
            135deg,
            #0ea5e9 0%,
            #2dd4bf 50%,
            #facc15 100%
          );
        "
      >
        Linear: Sky to Teal to Yellow
      </div>
      <div
        class="box"
        style="
          background: radial-gradient(
            circle at center,
            #ec4899 0%,
            #8b5cf6 60%,
            #1e1b4b 100%
          );
        "
      >
        Radial: Pink to Purple to Dark Navy
      </div>
      <div
        class="box"
        style="
          background: conic-gradient(
            from 0deg,
            red,
            yellow,
            lime,
            aqua,
            blue,
            magenta,
            red
          );
        "
      >
        Conic: Spectrum Rainbow
      </div>
    </div>
  </body>
</html>
